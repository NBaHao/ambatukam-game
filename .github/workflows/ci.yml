# Kiểm tra trên mỗi PR / push. Deploy do Cloudflare Workers Builds lo (xem AGENTS.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Không có file env trong repo: CI build bằng khoá thử Turnstile ở mode "ci"
      # (mode production từ chối khoá thử, xem vite.config.ts)
      - run: npm run build -- --mode ci
        env:
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  backend:
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.13.4"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Đóng gói thử Worker (không deploy)
        run: uv run pywrangler deploy --dry-run --outdir /tmp/worker-dist

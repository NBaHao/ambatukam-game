<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Ảnh preview khi chia sẻ link (Open Graph). Sửa xong chạy `npm run brand` để xuất og.png -->
  <style>
    .sans { font-family: "SF Pro Display", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "SF Mono", Menlo, monospace; }
  </style>
  <rect width="1200" height="630" fill="#0b0b0b"/>

  <!-- Logo như header -->
  <rect x="80" y="80" width="18" height="18" fill="#ff3b3b"/>
  <text x="116" y="98" class="sans" font-size="24" font-weight="800" letter-spacing="3" fill="#f2f2f2">AMBATUKAM</text>

  <!-- Tiêu đề + mô tả -->
  <text class="sans" font-weight="800" fill="#f2f2f2" font-size="92" letter-spacing="-1">
    <tspan x="76" y="248">Ambatukam</tspan>
    <tspan x="76" y="350">Challenge</tspan>
  </text>
  <text class="sans" font-size="30" fill="#8b8b8b">
    <tspan x="80" y="428">Nắm tay như cầm trụ, xóc thật nhanh</tspan>
    <tspan x="80" y="470">trước webcam. Leo bảng xếp hạng.</tspan>
  </text>
  <text x="80" y="552" class="mono" font-size="24" fill="#f2f2f2">ambatukam.bahao.site</text>

  <!-- Khung camera thu nhỏ: trụ, vùng hợp lệ, chấm khớp tay, bộ đếm -->
  <rect x="760" y="60" width="370" height="510" rx="10" fill="#000" stroke="#2a2a2a" stroke-width="2"/>
  <rect x="780" y="80" width="78" height="44" rx="4" fill="#111"/>
  <text x="819" y="112" class="mono" font-size="26" font-weight="700" fill="#f2f2f2" text-anchor="middle">7.5</text>
  <g transform="translate(955 285) rotate(18)">
    <rect x="-62" y="-170" width="124" height="340" rx="62" fill="none" stroke="#8b8b8b" stroke-width="2.5" stroke-dasharray="7 9"/>
    <rect x="-15" y="-150" width="30" height="300" rx="15" fill="#d9d9d9"/>
    <rect x="-15" y="-3" width="30" height="6" fill="#0b0b0b"/>
    <g fill="#f2f2f2">
      <circle cx="-40" cy="-28" r="4.5"/><circle cx="-31" cy="-30" r="4.5"/>
      <circle cx="-42" cy="-6" r="4.5"/><circle cx="-33" cy="-8" r="4.5"/>
      <circle cx="-43" cy="16" r="4.5"/><circle cx="-34" cy="14" r="4.5"/>
      <circle cx="-41" cy="38" r="4.5"/><circle cx="-32" cy="36" r="4.5"/>
      <circle cx="40" cy="-14" r="4.5"/><circle cx="2" cy="2" r="4.5"/>
    </g>
  </g>
  <text x="782" y="545" class="mono" font-size="96" font-weight="700" fill="#f2f2f2">42</text>
  <text x="912" y="543" class="sans" font-size="20" letter-spacing="2" fill="#8b8b8b">NHÁT</text>
</svg>
